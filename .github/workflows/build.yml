name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Needed so the release step can create a GitHub Release. Nothing else gets write access.
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Fail fast, before the long build, if the tag and the app's version numbers disagree.
      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $want = $env:TAG.TrimStart("v")
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          foreach ($pair in @(@("tauri.conf.json", $conf), @("package.json", $pkg), @("Cargo.toml", $cargo))) {
            if ($pair[1] -ne $want) { throw "$($pair[0]) says version $($pair[1]) but the tag is $env:TAG" }
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      # The vcpkg crate does not tell cargo to rebuild when VCPKG_ROOT changes, so a cached
      # target/ keeps stale library paths. Change this key whenever the vcpkg pin changes.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: vcpkg-b58529e

      - run: npm install

      # HEIC/HEIF/AVIF input uses libheif, installed with a pinned vcpkg so feature names
      # and versions are reproducible. Static triplet: the .exe needs no extra DLLs.
      #   libde265 = HEVC decoder for HEIC (LGPL)    aom = AV1 decoder for AVIF (BSD)
      # `core` turns off libheif's default features, which would add x265 (GPL, encoder only).
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-libheif-${{ runner.os }}-b58529e-v1

      - name: Install libheif
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP\vcpkg"
          git init $root
          git -C $root remote add origin https://github.com/microsoft/vcpkg
          git -C $root fetch --depth 1 origin b58529e33332fbb6dfe20317a82009b78ceeab36
          git -C $root checkout FETCH_HEAD
          & "$root\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          "VCPKGRS_TRIPLET=x64-windows-static-md" >> $env:GITHUB_ENV
          & "$root\vcpkg.exe" install "libheif[core,aom,libde265]:x64-windows-static-md" --disable-metrics

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml --features heif

      - name: Build
        run: npm run tauri build -- --features heif

      - uses: actions/upload-artifact@v4
        with:
          name: photo-converter-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/photo-converter.exe

      # Only for version tags (for example v0.2.0). Creates a DRAFT release, so you can
      # read the notes and publish it yourself.
      # GitHub rewrites spaces in asset names, so give the installer a clean name first.
      - name: Prepare release files
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          New-Item -ItemType Directory release | Out-Null
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $dest = "release/photo-converter-$($env:TAG)-windows-x64-setup.exe"
          Copy-Item $exe.FullName $dest
          $hash = (Get-FileHash $dest -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $dest -Leaf)" | Set-Content -Encoding ascii release/SHA256SUMS.txt

      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
