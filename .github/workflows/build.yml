name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm install

      # HEIC/HEIF/AVIF input uses libheif, installed with a pinned vcpkg so feature names
      # and versions are reproducible. Static triplet: the .exe needs no extra DLLs.
      #   libde265 = HEVC decoder for HEIC (LGPL)    aom = AV1 decoder for AVIF (BSD)
      # `core` turns off libheif's default features, which would add x265 (GPL, encoder only).
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-libheif-${{ runner.os }}-b58529e-v1

      - name: Install libheif
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP\vcpkg"
          git init $root
          git -C $root remote add origin https://github.com/microsoft/vcpkg
          git -C $root fetch --depth 1 origin b58529e33332fbb6dfe20317a82009b78ceeab36
          git -C $root checkout FETCH_HEAD
          & "$root\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          "VCPKGRS_TRIPLET=x64-windows-static-md" >> $env:GITHUB_ENV
          & "$root\vcpkg.exe" install "libheif[core,aom,libde265]:x64-windows-static-md" --disable-metrics

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml --features heif

      - name: Build
        run: npm run tauri build -- --features heif

      - uses: actions/upload-artifact@v4
        with:
          name: photo-converter-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/photo-converter.exe
