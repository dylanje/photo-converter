[package]
name = "photo-converter"
version = "0.1.0"
description = "A private, offline photo format converter."
license = "MIT"
edition = "2021"

[lib]
name = "photo_converter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
moxcms = "0.9"
serde = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff", "avif"] }

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
strip = true
